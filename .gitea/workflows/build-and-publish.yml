name: Build and Publish to Gitea Registry

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: your.gitea.instance
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Determine short SHA
        id: sha
        run: echo "short=$(echo ${{ gitea.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/dockerfile
          target: release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            your.gitea.instance/user/repo:latest
            your.gitea.instance/user/repo:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.revision=${{ gitea.sha }}
            org.opencontainers.image.description=Uptime Kuma - A self-hosted monitoring tool
          cache-from: type=registry,ref=your.gitea.instance/user/repo:buildcache
          cache-to: type=registry,ref=your.gitea.instance/user/repo:buildcache,mode=max
